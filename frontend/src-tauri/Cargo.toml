[package]
name = "interactive-tutor"
version = "0.5.0"
edition = "2021"

[lib]
name = "interactive_tutor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Exposes the WebView debug port for automated tests of a release build. Never ship this.
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tutor-geometry = { path = "../../engine/geometry" }
tutor-core = { path = "../../engine/core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
